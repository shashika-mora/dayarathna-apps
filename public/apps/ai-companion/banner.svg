<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <radialGradient id="cyanAiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridAi" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bgAi)" />
  <rect width="800" height="400" fill="url(#gridAi)" />
  <rect width="800" height="400" fill="url(#cyanAiGlow)" />

  <!-- Outer HUD Frame -->
  <g transform="translate(40, 35)">
    <!-- Main HUD Border -->
    <rect x="0" y="0" width="720" height="330" rx="14" fill="#080e1a" fill-opacity="0.9" stroke="#1e2c45" stroke-width="1.5" />
    
    <!-- Top HUD Banner -->
    <rect x="0" y="0" width="720" height="36" rx="14" fill="#0d1728" />
    <rect x="0" y="22" width="720" height="14" fill="#0d1728" />
    <line x1="0" y1="36" x2="720" y2="36" stroke="#1e2c45" stroke-width="1" />

    <text x="24" y="23" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2">AI COMPANION // WEAPON (CORTANA ARCHITECTURE)</text>
    <text x="696" y="23" fill="#c7f44a" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">PYSIDE6 OVERLAY ACTIVE</text>

    <!-- Holographic Center Orb & Waveforms -->
    <g transform="translate(360, 180)">
      <circle cx="0" cy="0" r="75" fill="url(#ringGlow)" />
      <!-- Concentric Orbital Rings -->
      <circle cx="0" cy="0" r="64" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#c7f44a" stroke-width="1" opacity="0.7" />
      
      <!-- Core Node -->
      <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.3" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" />

      <!-- Orbiting Pulse points -->
      <circle cx="48" cy="-14" r="3" fill="#38bdf8" />
      <circle cx="-38" cy="32" r="2.5" fill="#c7f44a" />
      <circle cx="20" cy="46" r="2" fill="#818cf8" />
    </g>

    <!-- Left Diagnostics Column -->
    <g transform="translate(30, 60)" font-family="ui-monospace, monospace">
      <rect x="0" y="0" width="230" height="235" rx="10" fill="#0d1524" stroke="#1a263c" stroke-width="1" />
      <text x="16" y="24" fill="#64748b" font-size="10" letter-spacing="1">COGNITIVE ENGINES</text>

      <!-- Identity Engine -->
      <g transform="translate(16, 40)">
        <text x="0" y="10" fill="#ffffff" font-size="12" font-weight="600">Identity Core</text>
        <text x="0" y="26" fill="#38bdf8" font-size="10">Active: Weapon Persona</text>
        <line x1="0" y1="36" x2="198" y2="36" stroke="#1e2c45" stroke-width="1" />
      </g>

      <!-- Persistent Memory -->
      <g transform="translate(16, 90)">
        <text x="0" y="10" fill="#ffffff" font-size="12" font-weight="600">Episodic Memory</text>
        <text x="0" y="26" fill="#c7f44a" font-size="10">Local SQLite DB synced</text>
        <line x1="0" y1="36" x2="198" y2="36" stroke="#1e2c45" stroke-width="1" />
      </g>

      <!-- Speech STT Engine -->
      <g transform="translate(16, 140)">
        <text x="0" y="10" fill="#ffffff" font-size="12" font-weight="600">Audio &amp; Voice Input</text>
        <text x="0" y="26" fill="#94a3b8" font-size="10">Real-time STT streaming</text>
        <line x1="0" y1="36" x2="198" y2="36" stroke="#1e2c45" stroke-width="1" />
      </g>

      <!-- WSL2 Bridge -->
      <g transform="translate(16, 190)">
        <text x="0" y="10" fill="#ffffff" font-size="12" font-weight="600">Subsystem Bridge</text>
        <text x="0" y="26" fill="#818cf8" font-size="10">Windows 11 + WSL2</text>
      </g>
    </g>

    <!-- Right Diagnostics Column -->
    <g transform="translate(460, 60)" font-family="ui-monospace, monospace">
      <rect x="0" y="0" width="230" height="235" rx="10" fill="#0d1524" stroke="#1a263c" stroke-width="1" />
      <text x="16" y="24" fill="#64748b" font-size="10" letter-spacing="1">EXECUTION FRAMEWORK</text>

      <g transform="translate(16, 42)">
        <text x="0" y="10" fill="#ffffff" font-size="11">Permissioned Tools</text>
        <rect x="0" y="18" width="198" height="22" rx="4" fill="#141f33" />
        <text x="8" y="33" fill="#38bdf8" font-size="10">File System // Shell</text>
      </g>

      <!-- Audio Waveform Visualization -->
      <g transform="translate(16, 92)">
        <text x="0" y="10" fill="#64748b" font-size="10">AUDIO RECEPTOR SPECTRUM</text>
        <g transform="translate(0, 22)">
          <rect x="0" y="10" width="4" height="18" rx="2" fill="#38bdf8" />
          <rect x="8" y="4" width="4" height="30" rx="2" fill="#38bdf8" />
          <rect x="16" y="14" width="4" height="10" rx="2" fill="#38bdf8" />
          <rect x="24" y="0" width="4" height="38" rx="2" fill="#c7f44a" />
          <rect x="32" y="8" width="4" height="22" rx="2" fill="#38bdf8" />
          <rect x="40" y="2" width="4" height="34" rx="2" fill="#38bdf8" />
          <rect x="48" y="12" width="4" height="14" rx="2" fill="#38bdf8" />
          <rect x="56" y="6" width="4" height="26" rx="2" fill="#c7f44a" />
          <rect x="64" y="16" width="4" height="8" rx="2" fill="#38bdf8" />
          <rect x="72" y="4" width="4" height="30" rx="2" fill="#38bdf8" />
          <rect x="80" y="0" width="4" height="38" rx="2" fill="#38bdf8" />
          <rect x="88" y="10" width="4" height="18" rx="2" fill="#818cf8" />
          <rect x="96" y="6" width="4" height="26" rx="2" fill="#818cf8" />
          <rect x="104" y="14" width="4" height="10" rx="2" fill="#38bdf8" />
          <rect x="112" y="2" width="4" height="34" rx="2" fill="#38bdf8" />
          <rect x="120" y="8" width="4" height="22" rx="2" fill="#c7f44a" />
          <rect x="128" y="16" width="4" height="8" rx="2" fill="#38bdf8" />
          <rect x="136" y="4" width="4" height="30" rx="2" fill="#38bdf8" />
          <rect x="144" y="0" width="4" height="38" rx="2" fill="#38bdf8" />
          <rect x="152" y="12" width="4" height="14" rx="2" fill="#38bdf8" />
          <rect x="160" y="8" width="4" height="22" rx="2" fill="#818cf8" />
          <rect x="168" y="14" width="4" height="10" rx="2" fill="#818cf8" />
          <rect x="176" y="4" width="4" height="30" rx="2" fill="#38bdf8" />
          <rect x="184" y="10" width="4" height="18" rx="2" fill="#38bdf8" />
          <rect x="192" y="16" width="4" height="8" rx="2" fill="#38bdf8" />
        </g>
      </g>

      <g transform="translate(16, 172)">
        <text x="0" y="10" fill="#64748b" font-size="10">PRIVACY POSTURE</text>
        <text x="0" y="28" fill="#cbd5e1" font-size="11">Zero cloud telemetry</text>
        <text x="0" y="44" fill="#64748b" font-size="10">All memory remains local</text>
      </g>
    </g>
  </g>
</svg>
