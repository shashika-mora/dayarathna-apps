<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910" />
      <stop offset="60%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f33" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="limeGlowSys" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#c7f44a" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#c7f44a" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridSys" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bgSys)" />
  <rect width="800" height="400" fill="url(#gridSys)" />
  <rect width="800" height="400" fill="url(#purpleGlow)" />
  <rect width="800" height="400" fill="url(#limeGlowSys)" />

  <!-- Fluent App Window Container -->
  <g transform="translate(50, 35)">
    <!-- App Window Surface -->
    <rect x="0" y="0" width="700" height="330" rx="14" fill="#090f1a" stroke="#1f2c42" stroke-width="1.5" />
    
    <!-- Titlebar / Header -->
    <rect x="0" y="0" width="700" height="42" rx="14" fill="#0f1828" />
    <rect x="0" y="28" width="700" height="14" fill="#0f1828" />
    <line x1="0" y1="42" x2="700" y2="42" stroke="#1f2c42" stroke-width="1" />

    <!-- Window buttons -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#22c55e" opacity="0.8" />

    <text x="80" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SystemMate</text>
    <text x="160" y="26" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">WINUI 3 // .NET 8 LTS // SQLITE</text>
    
    <!-- Sidebar navigation mock -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="160" height="288" fill="#0b1320" />
      <line x1="160" y1="0" x2="160" y2="288" stroke="#1f2c42" stroke-width="1" />

      <!-- Nav Items -->
      <g transform="translate(14, 20)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">
        <!-- Active Nav: Dashboard -->
        <rect x="0" y="0" width="132" height="32" rx="6" fill="#1b283d" />
        <rect x="0" y="8" width="3" height="16" rx="1.5" fill="#c7f44a" />
        <text x="14" y="20" fill="#ffffff" font-weight="600">Dashboard</text>

        <!-- Nav: Cleaner -->
        <g transform="translate(0, 42)">
          <text x="14" y="20" fill="#94a3b8">Storage Cleaner</text>
        </g>

        <!-- Nav: Audit History -->
        <g transform="translate(0, 80)">
          <text x="14" y="20" fill="#94a3b8">Audit History</text>
        </g>

        <!-- Nav: Settings -->
        <g transform="translate(0, 118)">
          <text x="14" y="20" fill="#94a3b8">Settings</text>
        </g>
      </g>

      <g transform="translate(14, 250)">
        <circle cx="6" cy="6" r="4" fill="#22c55e" />
        <text x="18" y="10" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">SQLite active</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(180, 56)">
      <!-- Telemetry Widgets Row -->
      <g>
        <!-- CPU Card -->
        <rect x="0" y="0" width="154" height="88" rx="10" fill="url(#cardGrad)" stroke="#1e2c44" stroke-width="1" />
        <text x="14" y="22" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">CPU USAGE</text>
        <text x="14" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">14%</text>
        <text x="68" y="50" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">3.84 GHz</text>
        <rect x="14" y="66" width="126" height="4" rx="2" fill="#1b273b" />
        <rect x="14" y="66" width="22" height="4" rx="2" fill="#38bdf8" />

        <!-- RAM Card -->
        <rect x="170" y="0" width="154" height="88" rx="10" fill="url(#cardGrad)" stroke="#1e2c44" stroke-width="1" />
        <text x="184" y="22" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">MEMORY</text>
        <text x="184" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">38%</text>
        <text x="240" y="50" fill="#c7f44a" font-family="ui-monospace, monospace" font-size="11">12.1 / 32 GB</text>
        <rect x="184" y="66" width="126" height="4" rx="2" fill="#1b273b" />
        <rect x="184" y="66" width="48" height="4" rx="2" fill="#c7f44a" />

        <!-- Disk Health -->
        <rect x="340" y="0" width="164" height="88" rx="10" fill="url(#cardGrad)" stroke="#1e2c44" stroke-width="1" />
        <text x="354" y="22" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">NVME STATUS</text>
        <text x="354" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">Good</text>
        <text x="424" y="50" fill="#7c5cfc" font-family="ui-monospace, monospace" font-size="11">34°C</text>
        <rect x="354" y="66" width="136" height="4" rx="2" fill="#1b273b" />
        <rect x="354" y="66" width="110" height="4" rx="2" fill="#7c5cfc" />
      </g>

      <!-- Transparent Cleaner Section -->
      <g transform="translate(0, 104)">
        <rect x="0" y="0" width="504" height="152" rx="10" fill="#0d1624" stroke="#1f2c42" stroke-width="1" />
        <text x="18" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Storage Cleanup Preview — Honest Verification</text>
        <text x="486" y="24" fill="#c7f44a" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">4.82 GB Recoverable</text>

        <!-- Category Items -->
        <g transform="translate(18, 40)" font-family="ui-monospace, monospace" font-size="11">
          <!-- Row 1: Temp files -->
          <rect x="0" y="0" width="14" height="14" rx="3" fill="#c7f44a" />
          <path d="M 3 7 L 6 10 L 11 4" stroke="#000000" stroke-width="1.8" fill="none" />
          <text x="24" y="11" fill="#e2e8f0">Windows Temporary Files (%TEMP%)</text>
          <text x="468" y="11" fill="#94a3b8" text-anchor="end">1,420 files · 1.84 GB</text>

          <!-- Row 2: Browser Cache -->
          <g transform="translate(0, 24)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#c7f44a" />
            <path d="M 3 7 L 6 10 L 11 4" stroke="#000000" stroke-width="1.8" fill="none" />
            <text x="24" y="11" fill="#e2e8f0">Chromium &amp; Edge Browser Cache</text>
            <text x="468" y="11" fill="#94a3b8" text-anchor="end">3,892 files · 2.15 GB</text>
          </g>

          <!-- Row 3: Dev Cache -->
          <g transform="translate(0, 48)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#1b283d" stroke="#334155" stroke-width="1" />
            <text x="24" y="11" fill="#94a3b8">Developer Caches (VS Code, npm, pip)</text>
            <text x="468" y="11" fill="#64748b" text-anchor="end">Optional · 830 MB</text>
          </g>
        </g>

        <!-- Confirmation Action Button -->
        <rect x="18" y="114" width="150" height="26" rx="6" fill="#c7f44a" />
        <text x="93" y="131" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Approve &amp; Log Clean</text>
        <text x="180" y="131" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">All operations logged to history.db prior to purge</text>
      </g>
    </g>
  </g>
</svg>
