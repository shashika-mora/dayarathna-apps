<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060910" />
      <stop offset="50%" stop-color="#0e1626" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <radialGradient id="blueDevGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberDevGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridDev" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bgDev)" />
  <rect width="800" height="400" fill="url(#gridDev)" />
  <rect width="800" height="400" fill="url(#blueDevGlow)" />
  <rect width="800" height="400" fill="url(#amberDevGlow)" />

  <!-- App Window Container -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="700" height="320" rx="14" fill="#0b111e" stroke="#1e2c45" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="700" height="38" rx="14" fill="#111929" />
    <rect x="0" y="24" width="700" height="14" fill="#111929" />
    <line x1="0" y1="38" x2="700" y2="38" stroke="#1e2c45" stroke-width="1" />

    <circle cx="22" cy="19" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="19" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="54" cy="19" r="5" fill="#22c55e" opacity="0.8" />
    <text x="78" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">DevAtlas</text>
    <text x="156" y="23" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">AVALONIA UI // .NET 10 // LOCAL WORKSPACE MANAGER</text>
    <text x="670" y="23" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">Offline Mode</text>

    <!-- Workspace Explorer Columns -->
    <g transform="translate(20, 52)">
      <!-- Left: Discovered Repos List -->
      <g>
        <rect x="0" y="0" width="220" height="246" rx="10" fill="#0e1624" stroke="#1a273c" stroke-width="1" />
        <text x="14" y="22" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">LOCAL REPOSITORIES (12)</text>

        <!-- Repo 1: Selected -->
        <g transform="translate(10, 36)">
          <rect x="0" y="0" width="200" height="48" rx="7" fill="#1a283f" stroke="#38bdf8" stroke-width="1" />
          <text x="12" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">dayarathna-apps</text>
          <text x="12" y="36" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">main · Next.js / React</text>
          <circle cx="186" cy="24" r="3" fill="#22c55e" />
        </g>

        <!-- Repo 2 -->
        <g transform="translate(10, 90)">
          <rect x="0" y="0" width="200" height="46" rx="7" fill="#111a28" />
          <text x="12" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">SystemMate</text>
          <text x="12" y="35" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">main · .NET 8 / C#</text>
        </g>

        <!-- Repo 3 -->
        <g transform="translate(10, 142)">
          <rect x="0" y="0" width="200" height="46" rx="7" fill="#111a28" />
          <text x="12" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">GameBooster</text>
          <text x="12" y="35" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">main · WinUI 3</text>
        </g>

        <!-- Repo 4 -->
        <g transform="translate(10, 194)">
          <rect x="0" y="0" width="200" height="42" rx="7" fill="#111a28" />
          <text x="12" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">ai-companion</text>
          <text x="12" y="33" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">v0.3 · Python</text>
        </g>
      </g>

      <!-- Center & Right: Detail & Git Inspector -->
      <g transform="translate(236, 0)">
        <rect x="0" y="0" width="424" height="246" rx="10" fill="#0e1624" stroke="#1a273c" stroke-width="1" />
        
        <!-- Header -->
        <g transform="translate(20, 20)">
          <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">dayarathna-apps</text>
          <text x="0" y="34" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">C:\Users\shashika\Desktop\Repos\dayarathna-apps</text>
          <rect x="300" y="4" width="84" height="22" rx="5" fill="#c7f44a" fill-opacity="0.15" stroke="#c7f44a" stroke-opacity="0.3" stroke-width="1" />
          <text x="342" y="19" fill="#c7f44a" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" text-anchor="middle">CLEAN TREE</text>
        </g>

        <!-- Tech Detection Pills -->
        <g transform="translate(20, 68)" font-family="ui-monospace, monospace" font-size="10">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#1e2c45" />
          <text x="30" y="14" fill="#38bdf8" text-anchor="middle">Next.js</text>

          <rect x="68" y="0" width="76" height="20" rx="4" fill="#1e2c45" />
          <text x="106" y="14" fill="#60a5fa" text-anchor="middle">TypeScript</text>

          <rect x="152" y="0" width="76" height="20" rx="4" fill="#1e2c45" />
          <text x="190" y="14" fill="#38bdf8" text-anchor="middle">Tailwind v4</text>

          <rect x="236" y="0" width="66" height="20" rx="4" fill="#1e2c45" />
          <text x="269" y="14" fill="#f59e0b" text-anchor="middle">Firebase</text>
        </g>

        <!-- Git Status & Branch Inspection -->
        <g transform="translate(20, 106)" font-family="ui-monospace, monospace">
          <rect x="0" y="0" width="384" height="120" rx="8" fill="#090f19" stroke="#192437" stroke-width="1" />
          <text x="14" y="22" fill="#64748b" font-size="10">LOCAL GIT TELEMETRY</text>
          
          <g transform="translate(14, 38)" font-size="11">
            <circle cx="4" cy="5" r="3" fill="#22c55e" />
            <text x="14" y="9" fill="#e2e8f0">Branch: <tspan fill="#38bdf8">main</tspan> (tracking origin/main)</text>

            <text x="14" y="30" fill="#94a3b8" font-size="10">Commit: f40be7a · feat: rich metadata and catalogue engine</text>
            <text x="14" y="48" fill="#64748b" font-size="10">Working directory: clean · zero untracked files</text>

            <rect x="14" y="58" width="130" height="18" rx="4" fill="#1c283d" />
            <text x="79" y="71" fill="#38bdf8" font-size="9" text-anchor="middle">Rescan Workspace (F5)</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
