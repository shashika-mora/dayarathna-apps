<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>
    <radialGradient id="purpleGbGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mintGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridGb" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="400" fill="url(#bgGb)" />
  <rect width="800" height="400" fill="url(#gridGb)" />
  <rect width="800" height="400" fill="url(#purpleGbGlow)" />
  <rect width="800" height="400" fill="url(#mintGlow)" />

  <!-- App Window Container -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="700" height="320" rx="14" fill="#0c121e" stroke="#1f2c42" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="700" height="38" rx="14" fill="#131d2e" />
    <rect x="0" y="24" width="700" height="14" fill="#131d2e" />
    <line x1="0" y1="38" x2="700" y2="38" stroke="#1f2c42" stroke-width="1" />

    <circle cx="22" cy="19" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="19" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="54" cy="19" r="5" fill="#22c55e" opacity="0.8" />
    <text x="80" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">GameBooster</text>
    <text x="170" y="23" fill="#9b8afb" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">REVERSIBLE GAME SESSIONS // OFFLINE-FIRST</text>
    <text x="670" y="23" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">System ready</text>

    <!-- Main Content Grid -->
    <g transform="translate(24, 52)">
      <!-- Left Hero Banner -->
      <g>
        <rect x="0" y="0" width="410" height="136" rx="12" fill="#182335" stroke="#253650" stroke-width="1" />
        <text x="20" y="24" fill="#9b8afb" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">SESSION CONTROL</text>
        <text x="20" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Play with a plan.</text>
        <text x="20" y="74" fill="#a99cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Return to normal.</text>
        <text x="20" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Reversible power plans restored on game exit. Zero telemetry.</text>
        <rect x="20" y="108" width="130" height="20" rx="5" fill="#7c5cfc" />
        <text x="85" y="122" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Launch Active Plan</text>
      </g>

      <!-- Right Telemetry Gauges -->
      <g transform="translate(424, 0)">
        <rect x="0" y="0" width="228" height="136" rx="12" fill="#141d2c" stroke="#223147" stroke-width="1" />
        <text x="16" y="24" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">HARDWARE MONITORS</text>

        <!-- CPU -->
        <g transform="translate(16, 36)">
          <text x="0" y="12" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">CPU Load</text>
          <text x="196" y="12" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">8%</text>
          <rect x="0" y="18" width="196" height="4" rx="2" fill="#1f2c42" />
          <rect x="0" y="18" width="20" height="4" rx="2" fill="#6ee7b7" />
        </g>

        <!-- RAM -->
        <g transform="translate(16, 68)">
          <text x="0" y="12" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Memory</text>
          <text x="196" y="12" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="end">9.4 GB</text>
          <rect x="0" y="18" width="196" height="4" rx="2" fill="#1f2c42" />
          <rect x="0" y="18" width="60" height="4" rx="2" fill="#38bdf8" />
        </g>

        <!-- Power plan -->
        <g transform="translate(16, 100)">
          <text x="0" y="12" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">PROFILE</text>
          <text x="196" y="12" fill="#c7f44a" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="end">Performance (High)</text>
        </g>
      </g>

      <!-- Bottom Library & Session History Row -->
      <g transform="translate(0, 148)">
        <!-- Library List -->
        <rect x="0" y="0" width="320" height="106" rx="10" fill="#101826" stroke="#1f2c42" stroke-width="1" />
        <text x="14" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Discovered Steam &amp; Local Games</text>
        <g transform="translate(14, 30)">
          <rect x="0" y="4" width="22" height="22" rx="5" fill="#7c5cfc" />
          <text x="11" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">C</text>
          <text x="32" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Cyberpunk 2077</text>
          <text x="290" y="18" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">Performance</text>

          <rect x="0" y="34" width="22" height="22" rx="5" fill="#2563eb" />
          <text x="11" y="49" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">E</text>
          <text x="32" y="48" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Elden Ring</text>
          <text x="290" y="48" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" text-anchor="end">Performance</text>
        </g>

        <!-- Sessions & Recovery List -->
        <g transform="translate(332, 0)">
          <rect x="0" y="0" width="320" height="106" rx="10" fill="#101826" stroke="#1f2c42" stroke-width="1" />
          <text x="14" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Crash &amp; State Recovery Safety</text>
          <g transform="translate(14, 34)" font-family="ui-monospace, monospace" font-size="10">
            <circle cx="4" cy="6" r="3" fill="#6ee7b7" />
            <text x="14" y="10" fill="#cbd5e1">Saved Scheme: SCHEME_BALANCED</text>
            <text x="14" y="28" fill="#64748b">Committed to SQLite before launch</text>
            <circle cx="4" cy="46" r="3" fill="#c7f44a" />
            <text x="14" y="50" fill="#cbd5e1">Reversion Verified on Process Exit</text>
            <text x="14" y="68" fill="#64748b">No lingering elevated background power state</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
