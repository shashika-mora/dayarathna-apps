<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#080d18" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7f44a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="halo" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="limeHalo" cx="30%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#c7f44a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#c7f44a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="400" fill="url(#bg)" />
  <rect width="800" height="400" fill="url(#grid)" />
  <rect width="800" height="400" fill="url(#halo)" />
  <rect width="800" height="400" fill="url(#limeHalo)" />

  <!-- Terminal Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Terminal Background Shadow -->
    <rect x="0" y="0" width="680" height="310" rx="14" fill="#05080e" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect x="0" y="0" width="680" height="38" rx="14" fill="#0d1524" />
    <rect x="0" y="24" width="680" height="14" fill="#0d1524" />
    <line x1="0" y1="38" x2="680" y2="38" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="22" cy="19" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="38" cy="19" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="54" cy="19" r="5" fill="#22c55e" opacity="0.8" />
    
    <!-- Titlebar text -->
    <text x="340" y="23" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" letter-spacing="1">WINDOWS POWER PLAN SWITCHER // powercfg.exe</text>

    <!-- Terminal Content Area -->
    <g transform="translate(26, 60)" font-family="ui-monospace, monospace">
      <!-- Active Scheme Row -->
      <text x="0" y="15" fill="#64748b" font-size="11" letter-spacing="1">CURRENT STATUS</text>
      <rect x="0" y="26" width="628" height="36" rx="8" fill="#0e1828" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="44" r="4" fill="#c7f44a" />
      <text x="34" y="48" fill="#e2e8f0" font-size="12" font-weight="600">Active Scheme: <tspan fill="#c7f44a">High Performance</tspan> (SCHEME_MIN)</text>
      <text x="590" y="48" fill="#64748b" font-size="11" text-anchor="end">GUID: 8c5e7fda-...-99fbee4166d1</text>

      <!-- Power Plan Selector Cards -->
      <g transform="translate(0, 80)">
        <!-- Option 1: Balanced -->
        <rect x="0" y="0" width="198" height="120" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="24" fill="#64748b" font-size="10" font-weight="bold">PRESET 01</text>
        <text x="16" y="48" fill="#cbd5e1" font-size="15" font-weight="bold">Balanced</text>
        <text x="16" y="68" fill="#64748b" font-size="10">Adaptive scaling</text>
        <text x="16" y="84" fill="#64748b" font-size="10">Standard system curve</text>
        <rect x="16" y="98" width="55" height="12" rx="3" fill="#1e293b" />
        <text x="43" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">DEFAULT</text>

        <!-- Option 2: High Performance (Selected) -->
        <rect x="215" y="0" width="198" height="120" rx="10" fill="#0b172b" stroke="#c7f44a" stroke-width="1.5" />
        <text x="231" y="24" fill="#c7f44a" font-size="10" font-weight="bold">PRESET 02 [ACTIVE]</text>
        <text x="231" y="48" fill="#ffffff" font-size="15" font-weight="bold">High Performance</text>
        <text x="231" y="68" fill="#94a3b8" font-size="10">Maximum CPU clock</text>
        <text x="231" y="84" fill="#94a3b8" font-size="10">Zero core unparking delay</text>
        <rect x="231" y="98" width="60" height="12" rx="3" fill="#c7f44a" fill-opacity="0.2" />
        <text x="261" y="107" fill="#c7f44a" font-size="8" font-weight="bold" text-anchor="middle">SELECTED</text>

        <!-- Option 3: Power Saver -->
        <rect x="430" y="0" width="198" height="120" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
        <text x="446" y="24" fill="#64748b" font-size="10" font-weight="bold">PRESET 03</text>
        <text x="446" y="48" fill="#cbd5e1" font-size="15" font-weight="bold">Power Saver</text>
        <text x="446" y="68" fill="#64748b" font-size="10">Energy conservation</text>
        <text x="446" y="84" fill="#64748b" font-size="10">Lower thermal dissipation</text>
        <rect x="446" y="98" width="65" height="12" rx="3" fill="#1e293b" />
        <text x="478" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">ECO MODE</text>
      </g>

      <!-- Bottom Status Line -->
      <g transform="translate(0, 222)">
        <text x="0" y="0" fill="#64748b" font-size="10">&gt; powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c</text>
        <text x="590" y="0" fill="#38bdf8" font-size="10" text-anchor="end">Execution time: 14ms</text>
      </g>
    </g>
  </g>
</svg>
